name: Frontend Sonar baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Analyze blog-client baseline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require Sonar configuration
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_ORGANIZATION"

      - name: Analyze blog-client baseline
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
        with:
          projectBaseDir: blog-client
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
