name: Trivy published image rescan

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: trivy-published-rescan
  cancel-in-progress: false

jobs:
  rescan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Authenticate for private GHCR packages
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify signatures and rescan the latest completed main release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: python3 scripts/rescan_release.py --output "$RUNNER_TEMP/rescan"
      - name: Retain current findings and release identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-image-rescan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rescan/
          if-no-files-found: error
          retention-days: 30
      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
